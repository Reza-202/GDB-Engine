name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment & Secrets
        run: |
          set -e
          echo "Preparing environment..."

          # 1. Ensure .env exists for the Secrets Gradle Plugin
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

          # 2. Restore or generate debug.keystore required by app/build.gradle.kts
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore || true
            fi
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating standard debug.keystore via keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Ensure gradlew wrapper exists and is executable
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

          echo "Environment preparation complete."
          ls -la debug.keystore gradlew .env

      - name: Run GDB-SPEC Automated Unit & Verification Tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Report If Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate & Package APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/debug/ -type f -name "*.apk" -exec cp {} output_apk/gdb-engine-debug.apk \;
          echo "Output APK details:"
          ls -lh output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdb-engine-debug-apk
          path: output_apk/gdb-engine-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-latest"
          echo "Publishing direct APK download to GitHub Releases with tag $TAG..."
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" output_apk/gdb-engine-debug.apk \
            --title "📱 GDB Engine APK (Direct Download)" \
            --notes "Direct APK download ready to install directly on Android devices. Generated from commit $GITHUB_SHA." \
            --latest

      - name: Build Summary
        if: always()
        run: |
          echo "### 🚀 GDB Engine APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Spec Version:** \`GDB-SPEC v3.50 — MASTER COMPLETE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Certified Baseline:** \`BASELINE-GDB-v3.50-BOOTSTRAP-REV1\`" >> $GITHUB_STEP_SUMMARY
          if [ -f output_apk/gdb-engine-debug.apk ]; then
            echo "- **Status:** ✅ Build Succeeded & All Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download:** Check the repository [Releases](../../releases) tab for raw \`gdb-engine-debug.apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact Download:** \`gdb-engine-debug-apk\` (ZIP) available in Artifacts table below" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          fi
